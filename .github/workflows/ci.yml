name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-static:
    name: Python y configuración de agentes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas de agentes/ (sin RAG/ML pesado)
        # Este job es la vía rápida "sin dependencias RAG" (ver docs/ARQUITECTURA.md,
        # Contratos de prueba). agentes/vigilancia_dof.py y vigilancia_jurisprudencial.py
        # importan requests/bs4 a nivel de módulo, y tests/test_vigilancia_*.py los
        # ejercita — sin esto, "python -m unittest discover" falla con
        # ModuleNotFoundError antes de correr un solo caso.
        run: pip install requests beautifulsoup4

      - name: Compilar módulos Python
        run: >-
          python -m compileall -q
          OpenNotebook.py scoring_vvca.py vvca_full.py capturar_rag.py
          router_competencia.py memoria_cli.py plan_audit.py scripts agentes itosturre tests

      - name: Probar políticas VVCA puras
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Evaluar Gold Set VVCA
        run: python scripts/evaluate_gold_set.py

      - name: Evaluar Gold Set de planes
        run: python scripts/evaluate_plan_gold_set.py

      - name: Evaluar Gold Set de fidelidad
        run: python scripts/evaluate_fidelidad_gold_set.py

      - name: Verificar superficies Claude/Codex
        run: python scripts/check_agent_surfaces.py

      - name: Verificar política de datos
        run: python scripts/check_sensitive_paths.py

      - name: Smoke test del router de competencia
        run: >-
          python -c "import router_competencia as r;
          c=r.resolver('amparo_directo','penal');
          assert 'Tribunal Colegiado' in c.organo and 'SCJN' not in c.organo"

  scraper-offline:
    name: Parser y resiliencia SJF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/itosturre-scraper/package-lock.json

      - name: Instalar dependencias del scraper
        run: npm ci --prefix services/itosturre-scraper

      - name: Probar parser de vigencia sin red
        run: python scripts/test_scraper_offline.py
