name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-static:
    name: Python y configuración de agentes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar módulos Python
        run: >-
          python -m compileall -q
          OpenNotebook.py scoring_vvca.py vvca_full.py capturar_rag.py
          router_competencia.py scripts agentes itosturre tests

      - name: Probar políticas VVCA puras
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Evaluar Gold Set VVCA
        run: python scripts/evaluate_gold_set.py

      - name: Verificar superficies Claude/Codex
        run: python scripts/check_agent_surfaces.py

      - name: Verificar política de datos
        run: python scripts/check_sensitive_paths.py

      - name: Smoke test del router de competencia
        run: >-
          python -c "import router_competencia as r;
          c=r.resolver('amparo_directo','penal');
          assert 'Tribunal Colegiado' in c.organo and 'SCJN' not in c.organo"

  scraper-offline:
    name: Parser y resiliencia SJF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/itosturre-scraper/package-lock.json

      - name: Instalar dependencias del scraper
        run: npm ci --prefix services/itosturre-scraper

      - name: Probar parser de vigencia sin red
        run: python scripts/test_scraper_offline.py
